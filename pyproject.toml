[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gacha-probability-validator"
version = "0.1.0"
description = "공시된 가챠 확률과 실제 뽑기 결과를 통계적으로 검증하는 도구"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 테스트 실행 시 로그를 바로 화면(터미널, VSCode Test Results)에 출력
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"
